name: Build Solana Programs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'solana/**'

env:
  SOLANA_VERSION: v4.3.0
  SOLANA_RPC_URL: https://api.testnet.solana.com

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 \
              --retry 10 \
              --retry-all-errors \
              --location \
              --fail \
              https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustup toolchain install 1.85.0 \
            --profile minimal \
            --no-self-update

          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Verify Solana build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          command -v cargo
          cargo --version
          command -v cargo-build-sbf
          cargo-build-sbf --version

          cargo build-sbf --help >/dev/null

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Programs
        working-directory: ./solana
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          rm -rf target/deploy
          mkdir -p target/deploy

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-oracle-bridge/Cargo.toml \
            -- --locked

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-token/Cargo.toml \
            -- --locked

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-reserve/Cargo.toml \
            -- --locked

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-governance/Cargo.toml \
            -- --locked

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy/*.so
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy

      - name: Verify deployment artifacts
        shell: bash
        run: |
          set -euo pipefail

          declare -A expected=(
            [oracle]="brdc_oracle_bridge.so"
            [token]="brdc_solana_token.so"
            [reserve]="brdc_solana_reserve.so"
            [governance]="brdc_solana_governance.so"
          )

          for name in "${!expected[@]}"; do
            artifact="solana/target/deploy/${expected[$name]}"

            if [[ ! -f "$artifact" ]]; then
              echo "::error::Missing deployment artifact for $name: $artifact"
              echo "Available artifacts:"
              find solana/target/deploy \
                -maxdepth 1 \
                -type f \
                -name '*.so' \
                -printf '  %f\n' \
                | sort
              exit 1
            fi

            if [[ ! -s "$artifact" ]]; then
              echo "::error::Deployment artifact is empty: $artifact"
              exit 1
            fi

            echo "Verified $name: $artifact"
          done

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Configure Wallet
        shell: bash
        env:
          SOLANA_KEYPAIR_SECRET: ${{ secrets.SOLANA_KEYPAIR }}
        run: |
          set -euo pipefail

          KEYPAIR_PATH="$RUNNER_TEMP/solana-deployer.json"

          if [[ -z "${SOLANA_KEYPAIR_SECRET}" ]]; then
            echo "::error::SOLANA_KEYPAIR secret is empty or unavailable"
            exit 1
          fi

          printf '%s' "$SOLANA_KEYPAIR_SECRET" > "$KEYPAIR_PATH"
          chmod 600 "$KEYPAIR_PATH"

          # Confirms that the secret contains a valid Solana keypair.
          solana address --keypair "$KEYPAIR_PATH"

          solana config set \
            --keypair "$KEYPAIR_PATH" \
            --url "$SOLANA_RPC_URL"

          echo "SOLANA_KEYPAIR_PATH=$KEYPAIR_PATH" >> "$GITHUB_ENV"

      - name: Check deployment wallet balance
        shell: bash
        env:
          SOLANA_KEYPAIR_PATH: ${{ env.SOLANA_KEYPAIR_PATH }}
        run: |
          set -euo pipefail

          export PATH="$SOLANA_BIN:$PATH"

          wallet="$(solana address \
            --keypair "$SOLANA_KEYPAIR_PATH")"

          balance_output="$(solana balance \
            --lamports \
            --keypair "$SOLANA_KEYPAIR_PATH" \
            --url "$SOLANA_RPC_URL")"

          # Solana CLI outputs values such as:
          # "10000000000 lamports"
          balance_lamports="$(awk '{ print $1 }' <<< "$balance_output")"

          # One SOL is a conservative minimum for deploying/upgrading
          # the four programs in this workflow. The actual amount depends
          # on each program's ELF size and whether it is a new deployment.
          required_lamports=1000000000
          required_sol="1.0"

          echo "Deployment wallet: $wallet"
          echo "Deployment wallet balance: ${balance_output}"
          echo "Required minimum balance: ${required_lamports} lamports (${required_sol} SOL)"

          if ! [[ "$balance_lamports" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse the Solana wallet balance: $balance_output"
            exit 1
          fi

          if (( balance_lamports < required_lamports )); then
            actual_sol="$(awk -v lamports="$balance_lamports" \
              'BEGIN { printf "%.9f", lamports / 1000000000 }')"

            echo "::error::Insufficient SOL on Solana testnet."
            echo "::error::Wallet: $wallet"
            echo "::error::Current balance: ${actual_sol} SOL"
            echo "::error::Minimum required: ${required_sol} SOL"
            echo "::error::Fund this wallet on testnet, then rerun the workflow."
            exit 1
          fi

          echo "Deployment wallet has sufficient funds."

      - name: Deploy Programs
        working-directory: ./solana
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          declare -A programs=(
            [oracle]="target/deploy/brdc_oracle_bridge.so"
            [token]="target/deploy/brdc_solana_token.so"
            [reserve]="target/deploy/brdc_solana_reserve.so"
            [governance]="target/deploy/brdc_solana_governance.so"
          )

          for name in "${!programs[@]}"; do
            artifact="${programs[$name]}"

            if [[ ! -s "$artifact" ]]; then
              echo "::error::Invalid or missing artifact for $name: $artifact"
              exit 1
            fi

            echo "Deploying $name from $artifact"
            solana program deploy \
              --keypair "$SOLANA_KEYPAIR_PATH" \
              --url "$SOLANA_RPC_URL" \
              "$artifact"
          done
