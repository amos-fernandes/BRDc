name: Build Solana Programs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'solana/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify Solana build tools
        run: |
          command -v solana
          command -v cargo-build-sbf
          solana --version
          cargo-build-sbf --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Programs
        working-directory: ./solana
        run: |
          set -euxo pipefail
          cargo build-sbf --verbose --manifest-path programs/brdc-oracle-bridge/Cargo.toml
          cargo build-sbf --verbose --manifest-path programs/brdc-token/Cargo.toml
          cargo build-sbf --verbose --manifest-path programs/brdc-reserve/Cargo.toml
          cargo build-sbf --verbose --manifest-path programs/brdc-governance/Cargo.toml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy/*.so

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Configure Wallet
        run: |
          echo "${{ secrets.SOLANA_KEYPAIR }}" > keypair.json
          solana config set --keypair keypair.json --url https://api.testnet.solana.com

      - name: Deploy Programs
        working-directory: ./solana
        run: |
          solana program deploy target/deploy/libbrdc_oracle_bridge.so
          solana program deploy target/deploy/libbrdc_solana_token.so
          solana program deploy target/deploy/libbrdc_solana_reserve.so
          solana program deploy target/deploy/libbrdc_solana_governance.so
