name: Build Solana Programs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'solana/**'

env:
  SOLANA_VERSION: v2.3.7

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 \
              --retry 10 \
              --retry-all-errors \
              --location \
              --fail \
              https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustup toolchain install 1.85.0 \
            --profile minimal \
            --no-self-update

          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Verify Solana build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          command -v cargo
          cargo --version
          command -v cargo-build-sbf
          cargo-build-sbf --version

          cargo build-sbf --help >/dev/null

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Programs
        working-directory: ./solana
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          cargo build-sbf --verbose --manifest-path programs/brdc-oracle-bridge/Cargo.toml
          cargo build-sbf --verbose --manifest-path programs/brdc-token/Cargo.toml
          cargo build-sbf --verbose --manifest-path programs/brdc-reserve/Cargo.toml
          cargo build-sbf --verbose --manifest-path programs/brdc-governance/Cargo.toml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy/*.so

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Configure Wallet
        run: |
          echo "${{ secrets.SOLANA_KEYPAIR }}" > keypair.json
          solana config set --keypair keypair.json --url https://api.testnet.solana.com

      - name: Deploy Programs
        working-directory: ./solana
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          solana program deploy target/deploy/libbrdc_oracle_bridge.so
          solana program deploy target/deploy/libbrdc_solana_token.so
          solana program deploy target/deploy/libbrdc_solana_reserve.so
          solana program deploy target/deploy/libbrdc_solana_governance.so
