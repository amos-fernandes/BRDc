name: Build Solana Programs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'solana/**'

env:
  SOLANA_VERSION: v4.3.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 \
              --retry 10 \
              --retry-all-errors \
              --location \
              --fail \
              https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustup toolchain install 1.85.0 \
            --profile minimal \
            --no-self-update

          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Verify Solana build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          command -v cargo
          cargo --version
          command -v cargo-build-sbf
          cargo-build-sbf --version

          cargo build-sbf --help >/dev/null

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Programs
        working-directory: ./solana
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-oracle-bridge/Cargo.toml \
            -- --locked

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-token/Cargo.toml \
            -- --locked

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-reserve/Cargo.toml \
            -- --locked

          cargo build-sbf \
            --verbose \
            --manifest-path programs/brdc-governance/Cargo.toml \
            -- --locked

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy/*.so
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy

      - name: Verify deployment artifacts
        shell: bash
        run: |
          set -euxo pipefail

          find solana/target/deploy -maxdepth 1 -type f -name '*.so' -print

          for program in \
            libbrdc_oracle_bridge.so \
            libbrdc_solana_token.so \
            libbrdc_solana_reserve.so \
            libbrdc_solana_governance.so
          do
            test -f "solana/target/deploy/$program" || {
              echo "::error::Missing deployment artifact: $program"
              exit 1
            }
          done

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Configure Wallet
        shell: bash
        env:
          SOLANA_KEYPAIR_SECRET: ${{ secrets.SOLANA_KEYPAIR }}
        run: |
          set -euo pipefail

          KEYPAIR_PATH="$RUNNER_TEMP/solana-deployer.json"

          if [[ -z "${SOLANA_KEYPAIR_SECRET}" ]]; then
            echo "::error::SOLANA_KEYPAIR secret is empty or unavailable"
            exit 1
          fi

          printf '%s' "$SOLANA_KEYPAIR_SECRET" > "$KEYPAIR_PATH"
          chmod 600 "$KEYPAIR_PATH"

          # Confirms that the secret contains a valid Solana keypair.
          solana address --keypair "$KEYPAIR_PATH"

          solana config set \
            --keypair "$KEYPAIR_PATH" \
            --url https://api.testnet.solana.com

          echo "SOLANA_KEYPAIR_PATH=$KEYPAIR_PATH" >> "$GITHUB_ENV"

      - name: Deploy Programs
        working-directory: ./solana
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          # Resolve artifacts by pattern to avoid hardcoded names
          oracle=$(find target/deploy -maxdepth 1 -type f -name '*oracle*bridge*.so' | head -n 1)
          token=$(find target/deploy -maxdepth 1 -type f -name '*token*.so' | head -n 1)
          reserve=$(find target/deploy -maxdepth 1 -type f -name '*reserve*.so' | head -n 1)
          governance=$(find target/deploy -maxdepth 1 -type f -name '*governance*.so' | head -n 1)

          for p in "$oracle" "$token" "$reserve" "$governance"; do
            [ -n "$p" ] && [ -f "$p" ] || {
              echo "::error::Could not resolve artifact: $p"
              exit 1
            }
          done

          solana program deploy --keypair "$SOLANA_KEYPAIR_PATH" "$oracle"
          solana program deploy --keypair "$SOLANA_KEYPAIR_PATH" "$token"
          solana program deploy --keypair "$SOLANA_KEYPAIR_PATH" "$reserve"
          solana program deploy --keypair "$SOLANA_KEYPAIR_PATH" "$governance"
