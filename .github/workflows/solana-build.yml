name: Build Solana Programs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'solana/**'

env:
  SOLANA_VERSION: stable
  SOLANA_RPC_URL: https://api.testnet.solana.com
  REQUIRED_DEPLOYMENT_SOL: "5"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 \
              --retry 10 \
              --retry-all-errors \
              --location \
              --fail \
              https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustup toolchain install nightly-2025-06-01 \
            --profile minimal \
            --no-self-update \
            --component rust-src

          rustup default nightly-2025-06-01
          rustup component add rust-src --toolchain nightly-2025-06-01

          rustc --version
          cargo --version

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Verify Solana build toolchain
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-06-01
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$SOLANA_BIN:$PATH"
          rustup default nightly-2025-06-01

          command -v cargo
          cargo --version
          command -v cargo-build-sbf
          cargo-build-sbf --version

          cargo build-sbf --help >/dev/null

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: ${{ runner.os }}-cargo-v5-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Programs
        working-directory: ./solana
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-06-01
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$SOLANA_BIN:$PATH"
          rustup default nightly-2025-06-01
          rustc --version
          cargo --version

          cargo build-sbf --verbose -p brdc-oracle-bridge -p brdc-solana-token -p brdc-solana-reserve -p brdc-solana-governance -- --locked

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy/*.so

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: solana-programs
          path: solana/target/deploy

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail

          INSTALLER_URL="https://release.anza.xyz/${SOLANA_VERSION}/install"

          curl --proto '=https' \
            --tlsv1.2 \
            --location \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            "$INSTALLER_URL" \
            -o /tmp/solana-install.sh

          sh /tmp/solana-install.sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          echo "SOLANA_BIN=$SOLANA_BIN" >> "$GITHUB_ENV"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo-build-sbf --version

      - name: Configure Wallet
        shell: bash
        env:
          SOLANA_KEYPAIR_SECRET: ${{ secrets.SOLANA_KEYPAIR }}
        run: |
          set -euo pipefail

          KEYPAIR_PATH="$RUNNER_TEMP/solana-deployer.json"

          if [[ -z "${SOLANA_KEYPAIR_SECRET}" ]]; then
            echo "::error::SOLANA_KEYPAIR secret is empty or unavailable"
            exit 1
          fi

          printf '%s' "$SOLANA_KEYPAIR_SECRET" > "$KEYPAIR_PATH"
          chmod 600 "$KEYPAIR_PATH"

          solana address --keypair "$KEYPAIR_PATH"

          solana config set \
            --keypair "$KEYPAIR_PATH" \
            --url "$SOLANA_RPC_URL"

          echo "SOLANA_KEYPAIR_PATH=$KEYPAIR_PATH" >> "$GITHUB_ENV"

      - name: Configure program keypairs
        shell: bash
        env:
          ORACLE_PROGRAM_KEYPAIR: ${{ secrets.ORACLE_PROGRAM_KEYPAIR }}
          TOKEN_PROGRAM_KEYPAIR: ${{ secrets.TOKEN_PROGRAM_KEYPAIR }}
          RESERVE_PROGRAM_KEYPAIR: ${{ secrets.RESERVE_PROGRAM_KEYPAIR }}
          GOVERNANCE_PROGRAM_KEYPAIR: ${{ secrets.GOVERNANCE_PROGRAM_KEYPAIR }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/program-keys"

          printf '%s' "$ORACLE_PROGRAM_KEYPAIR" \
            > "$RUNNER_TEMP/program-keys/oracle-keypair.json"
          printf '%s' "$TOKEN_PROGRAM_KEYPAIR" \
            > "$RUNNER_TEMP/program-keys/token-keypair.json"
          printf '%s' "$RESERVE_PROGRAM_KEYPAIR" \
            > "$RUNNER_TEMP/program-keys/reserve-keypair.json"
          printf '%s' "$GOVERNANCE_PROGRAM_KEYPAIR" \
            > "$RUNNER_TEMP/program-keys/governance-keypair.json"

          chmod 600 "$RUNNER_TEMP"/program-keys/*.json

      - name: Check deployment wallet balance
        shell: bash
        env:
          SOLANA_KEYPAIR_PATH: ${{ env.SOLANA_KEYPAIR_PATH }}
        run: |
          set -euo pipefail

          export PATH="$SOLANA_BIN:$PATH"

          wallet="$(solana address \
            --keypair "$SOLANA_KEYPAIR_PATH")"

          balance_output="$(solana balance \
            --lamports \
            --keypair "$SOLANA_KEYPAIR_PATH" \
            --url "$SOLANA_RPC_URL")"

          balance_lamports="$(awk '{ print $1 }' <<< "$balance_output")"

          required_sol="${REQUIRED_DEPLOYMENT_SOL:-5}"
          required_lamports="$(
            awk -v sol="$required_sol" \
              'BEGIN { printf "%.0f", sol * 1000000000 }'
          )"

          echo "Deployment wallet: $wallet"
          echo "Deployment wallet balance: ${balance_output}"
          echo "Required minimum balance: ${required_lamports} lamports (${required_sol} SOL)"

          if ! [[ "$balance_lamports" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse the Solana wallet balance: $balance_output"
            exit 1
          fi

          if (( balance_lamports < required_lamports )); then
            actual_sol="$(
              awk -v lamports="$balance_lamports" \
                'BEGIN { printf "%.9f", lamports / 1000000000 }'
            )"

            echo "::error::Insufficient SOL on Solana testnet."
            echo "::error::Wallet: $wallet"
            echo "::error::Current balance: ${actual_sol} SOL"
            echo "::error::Minimum required: ${required_sol} SOL"
            echo "::error::Fund this wallet on testnet, then rerun the workflow."
            exit 1
          fi

          echo "Deployment wallet has sufficient funds."

      - name: Deploy Programs
        working-directory: ./solana
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$SOLANA_BIN:$PATH"

          # Find actual artifacts in target directory
          ORACLE_SO=$(find target -maxdepth 4 -type f -name '*oracle*.so' | head -n 1)
          TOKEN_SO=$(find target -maxdepth 4 -type f -name '*token*.so' | head -n 1)
          RESERVE_SO=$(find target -maxdepth 4 -type f -name '*reserve*.so' | head -n 1)
          GOVERNANCE_SO=$(find target -maxdepth 4 -type f -name '*governance*.so' | head -n 1)

          echo "Found artifacts:"
          echo "  oracle: $ORACLE_SO"
          echo "  token: $TOKEN_SO"
          echo "  reserve: $RESERVE_SO"
          echo "  governance: $GOVERNANCE_SO"

          declare -A programs=(
            [oracle]="$ORACLE_SO|$RUNNER_TEMP/program-keys/oracle-keypair.json"
            [token]="$TOKEN_SO|$RUNNER_TEMP/program-keys/token-keypair.json"
            [reserve]="$RESERVE_SO|$RUNNER_TEMP/program-keys/reserve-keypair.json"
            [governance]="$GOVERNANCE_SO|$RUNNER_TEMP/program-keys/governance-keypair.json"
          )

          for name in "${!programs[@]}"; do
            IFS='|' read -r artifact program_id_keypair <<< "${programs[$name]}"

            [[ -n "$artifact" && -s "$artifact" ]] || {
              echo "::error::Invalid or missing artifact for $name: $artifact"
              exit 1
            }

            echo "Deploying $name"
            solana address --keypair "$program_id_keypair"

            solana program deploy \
              --keypair "$SOLANA_KEYPAIR_PATH" \
              --program-id "$program_id_keypair" \
              --url "$SOLANA_RPC_URL" \
              "$artifact"
          done