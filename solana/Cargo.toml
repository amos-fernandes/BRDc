[workspace]
members = [
    "programs/brdc-oracle-bridge",
    "programs/brdc-token",
    "programs/brdc-reserve",
    "programs/brdc-governance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AIBANK"]
description = "BRDc — Token de Índice Lastreado em Ativos Reais Brasileiros (Solana)"
license = "MIT"

[workspace.dependencies]
anchor-lang = "=0.29.0"
solana-program = "=2.1.0"
spl-token = { version = "=4.0.3", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "=2.3.0", features = ["no-entrypoint"] }
borsh = "=0.10.3"
proc-macro-crate = "=0.1.5"
blake3 = "=1.5.5"
digest = "=0.10.7"
crypto-common = "=0.1.7"
ring = "=0.16.20"
rand = "=0.8.5"
rand_core = "=0.6.4"
block-buffer = "=0.10.4"
hybrid-array = "=0.4.15"
subtle = "=2.4.1"
constant_time_eq = "=0.4.1"
toml_datetime = "=0.6.5"
toml_edit = "=0.21.0"
toml_parser = "=1.1.3"
indexmap = "=1.9.3"
hashbrown = "=0.12.3"
unicode-segmentation = "=1.10.1"
jobserver = "=0.1.32"
proc-macro2 = "=1.0.106"
syn = "=2.0.117"
quote = "=1.0.35"
zeroize = "=1.3.0"
zeroize_derive = "=1.3.0"
