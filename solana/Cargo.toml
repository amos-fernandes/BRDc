[workspace]
members = [
    "programs/brdc-oracle-bridge",
    "programs/brdc-token",
    "programs/brdc-reserve",
    "programs/brdc-governance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AIBANK"]
description = "BRDc — Token de Índice Lastreado em Ativos Reais Brasileiros (Solana)"
license = "MIT"

[workspace.dependencies]
anchor-lang = "0.29"
solana-program = "2.1"
spl-token = { version = "4", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2", features = ["no-entrypoint"] }
borsh = "0.9"
