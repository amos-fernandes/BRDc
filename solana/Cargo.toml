[workspace]
members = [
    "programs/brdc-oracle-bridge",
    "programs/brdc-token",
    "programs/brdc-reserve",
    "programs/brdc-governance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AIBANK"]
description = "BRDc — Token de Índice Lastreado em Ativos Reais Brasileiros (Solana)"
license = "MIT"

[workspace.dependencies]
solana-program = "=2.1.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
blake3 = "=1.5.5"
proc-macro-crate = "=0.1.5"
toml_edit = "=0.21.0"
toml_parser = "=1.1.2"
toml_datetime = "=0.6.5"
